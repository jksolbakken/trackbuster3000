name: main

on:
  push:
    branches:
      - main

permissions: {}  

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.x"
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12
      - name: Install deps
        run: pnpm i
      - name: Run tests
        run: pnpm test
